<!DOCTYPE html>
<html>
<head>
    <title>Login - Norcal Arcadian Fantasy</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
    <div class="auth-container">
        <h1>Login to Norcal Arcadian Fantasy</h1>
        <a href="{{ url_for('startgg_login') }}" class="button" style="background:#ff5a36;color:#fff;margin-bottom:20px;display:block;text-align:center;">Login with start.gg</a>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="button">Login</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</body>
</html>
